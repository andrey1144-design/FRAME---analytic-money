<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FRAME</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ee;--surface:#fbfaf7;--text:#111111;--muted:#615e57;--border:#111111;--accent:#e4452a;--accent-fg:#ffffff;--track:#d8d4cc;--thumb:#111111;--success:#1f7a4d;--warning:#9a5b00;--ok:var(--success);--warn:var(--warning);--s2:8px;--s3:16px;--s4:24px;--s5:40px;--lw:1px;--r:2px;--sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text)}
body{font:15px/1.45 var(--sans);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;background:transparent;border:var(--lw) solid var(--border);border-radius:var(--r);padding:8px 12px;cursor:pointer;min-height:36px}
button:hover{background:var(--track)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}.pri:hover{background:var(--accent);opacity:.88}
.top{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);border-bottom:var(--lw) solid var(--border);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.2em;font-size:18px}
nav{display:flex}nav button{border-radius:0;margin-right:-1px}nav button.on{background:var(--text);color:var(--bg)}
select{max-width:180px}
#st[data-s=saving],#st[data-s=err]{color:var(--warning)}#st[data-s=ok]{color:var(--success)}
#app{max-width:1100px;margin:0 auto;padding:var(--s4) var(--s3) var(--s5)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s3);margin-bottom:var(--s4);border-bottom:var(--lw) solid var(--border);padding-bottom:var(--s3);flex-wrap:wrap}
h1{font-size:clamp(32px,6vw,56px);letter-spacing:-.03em;font-weight:500;line-height:1}
.title{font:500 clamp(24px,5vw,40px)/1.1 var(--sans);letter-spacing:-.02em;background:transparent;border:0;border-bottom:var(--lw) solid var(--border);color:inherit;min-width:0;flex:1;padding:4px 0;border-radius:0}
.mono{font:11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--border);border:var(--lw) solid var(--border)}
.card{background:var(--surface);border:0;border-radius:0;text-align:left;padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2);min-height:170px}
.card:hover{background:var(--surface);outline:2px solid var(--accent);outline-offset:-2px}
.card h3{font-size:20px;font-weight:500;letter-spacing:-.01em}
.new{justify-content:center;align-items:center;color:var(--muted)}
.bar{height:10px;border:var(--lw) solid var(--border);background:var(--track)}.bar i{display:block;height:100%;background:var(--accent)}
.cols,.cols2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:var(--lw) solid var(--border)}
.cols2{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
@media(max-width:760px){.cols,.cols2{grid-template-columns:1fr}}
.panel{background:var(--surface);padding:var(--s4) var(--s3);display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.tabs{display:flex;flex-wrap:wrap;margin-bottom:var(--s3)}.tab{border-radius:0;margin:0 -1px -1px 0}.tab.on{background:var(--text);color:var(--bg)}
.txt,.num,select{font:inherit;color:var(--text);background:var(--bg);border:var(--lw) solid var(--border);border-radius:var(--r);padding:8px;min-width:0;width:100%}
.num{width:120px;font-family:var(--mono);text-align:right}
.fr{display:flex;gap:var(--s3);align-items:center}.fl{display:flex;justify-content:space-between}
.err{color:var(--warning);font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;height:24px;background:transparent;width:100%}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;margin-top:-9px;background:var(--thumb);border:var(--lw) solid var(--border);border-radius:0}
input[type=range]::-moz-range-track{height:4px;background:var(--track)}
input[type=range]::-moz-range-thumb{width:12px;height:20px;background:var(--thumb);border:var(--lw) solid var(--border);border-radius:0}
.big{font-size:clamp(44px,10vw,80px);font-weight:500;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:var(--s3);border-top:var(--lw) solid var(--border);padding-top:var(--s2)}.kv b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.msg{padding:var(--s2) var(--s3);border:var(--lw) solid var(--border)}.msg.ok{border-color:var(--success);color:var(--success)}.msg.w{border-color:var(--warning);color:var(--warning)}
.row{display:flex;gap:var(--s3);align-items:center;justify-content:space-between;border-radius:0;text-align:left;width:100%;margin-bottom:-1px}.row.on{outline:2px solid var(--accent);outline-offset:-2px}
.sw{display:flex}.sw i{width:14px;height:14px;border:1px solid var(--border);margin-right:-1px}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--s2)}
.role{display:flex;gap:var(--s2);align-items:center;text-align:left;flex-wrap:wrap}.role i{width:16px;height:16px;border:1px solid var(--border)}.role.on{outline:2px solid var(--accent);outline-offset:1px}
.cpf{position:relative;height:180px;border:var(--lw) solid var(--border);touch-action:none;cursor:crosshair}
.knob{position:absolute;width:16px;height:16px;margin:-8px;border:2px solid #fff;box-shadow:0 0 0 1px #000;border-radius:50%;pointer-events:none}
.cp{display:flex;flex-direction:column;gap:var(--s2)}
.hue::-webkit-slider-runnable-track{background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)!important}
.hue::-moz-range-track{background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)!important}
.cin{display:grid;grid-template-columns:44px 1fr auto;gap:var(--s2);align-items:center}
.bad{border-color:var(--warning)!important}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:var(--s3)}
.dlg{background:var(--surface);border:var(--lw) solid var(--border);padding:var(--s4);max-width:380px;width:100%;display:flex;flex-direction:column;gap:var(--s3)}
.acts{display:flex;gap:var(--s2);flex-wrap:wrap}
textarea.txt{min-height:170px;font-family:var(--mono);font-size:12px}
.dis{opacity:.45;pointer-events:none}

.sm{padding:2px 8px;min-height:28px;font-size:13px}
#fin .mnav{display:flex;align-items:center;gap:12px;margin-bottom:16px}#fin .mnav b{text-transform:capitalize;min-width:150px;text-align:center;font-weight:500}
#fin .grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:16px}
#fin .fk{background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:8px}
#fin .fkv{font-size:clamp(24px,5vw,34px);font-weight:500;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}#fin .fkv.w{color:var(--warning)}
#fin .acts{margin:16px 0}#fin .head{margin-bottom:16px;padding-bottom:12px}#fin h1{font-size:clamp(24px,5vw,34px);font-weight:500}
#fin .li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start}
#fin .li>div:first-child{min-width:0}#fin .li .mono{text-transform:none;letter-spacing:0;word-break:break-word}
#fin .rt{display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}#fin .rt b{font-variant-numeric:tabular-nums;font-weight:500;margin-right:4px}
#fin .tag{font:11px var(--mono);border:1px solid var(--border);padding:1px 6px;margin-left:6px}
#fin .tw{overflow-x:auto}#fin table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}#fin th,#fin td{border-bottom:1px solid var(--border);padding:8px;text-align:right;white-space:nowrap}#fin th:first-child,#fin td:first-child{text-align:left;text-transform:capitalize}#fin th{font:11px var(--mono);color:var(--muted);text-transform:uppercase}
#fin .ftabs{display:flex;overflow-x:auto;margin-bottom:16px}.ftabs button{border-radius:0;margin-right:-1px;white-space:nowrap}.ftabs button.on{background:var(--text);color:var(--bg)}
#fin .set{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px}#fin .sp{margin-top:24px}
#fin label,#fmd label{display:flex;flex-direction:column;gap:4px}#fmd .ck{flex-direction:row;align-items:center;gap:8px;padding:4px 0}
#fmd .ov{overflow:auto}#fmd .dlg{max-width:420px;max-height:100%;overflow:auto}
</style></head><body>
<header class="top"><div class="logo">FRAME</div>
<nav><button data-go="home">Проекты</button><button data-go="themes">Темы</button><button data-go="data">Данные</button></nav>
<select id="ps" aria-label="Проект"></select>
<span id="st" class="mono" data-s="ok" style="margin-left:auto">Загрузка…</span></header>
<main id="app"></main>
<script>
const $=(s,e=document)=>e.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10),cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('ru-RU')+' ₽',SCHEMA=1;
const ROLES=[['bg','Background'],['surface','Surface'],['text','Text'],['muted','Muted text'],['border','Border'],['accent','Accent'],['accentFg','Accent foreground'],['track','Slider track'],['thumb','Slider thumb'],['success','Success'],['warning','Warning']];
const CSSV={bg:'bg',surface:'surface',text:'text',muted:'muted',border:'border',accent:'accent',accentFg:'accent-fg',track:'track',thumb:'thumb',success:'success',warning:'warning'};
const PRESETS=[
{id:'paper',name:'Paper',preset:1,colors:{bg:'#f4f2ee',surface:'#fbfaf7',text:'#111111',muted:'#615e57',border:'#111111',accent:'#e4452a',accentFg:'#ffffff',track:'#d8d4cc',thumb:'#111111',success:'#1f7a4d',warning:'#9a5b00'}},
{id:'graphite',name:'Graphite',preset:1,colors:{bg:'#141517',surface:'#1c1d20',text:'#ececec',muted:'#9a9a9a',border:'#4a4b50',accent:'#ffd23f',accentFg:'#141517',track:'#34353a',thumb:'#ececec',success:'#5fd08f',warning:'#ffb454'}},
{id:'sage',name:'Sage',preset:1,colors:{bg:'#e6ebe2',surface:'#f0f3ec',text:'#1b2a1f',muted:'#51604f',border:'#2f4a38',accent:'#2f6b46',accentFg:'#ffffff',track:'#c4cfc0',thumb:'#1b2a1f',success:'#1f7a4d',warning:'#8a5200'}}];
let S={projects:[],palettes:[],ui:{view:'home',pid:null,gi:0,theme:'paper',role:'accent'}};
const cur=()=>S.projects.find(p=>p.id===S.ui.pid),allT=()=>[...PRESETS,...S.palettes],curT=()=>allT().find(t=>t.id===S.ui.theme)||PRESETS[0];
const saveUi=()=>{try{localStorage.setItem('frame.ui',JSON.stringify(S.ui))}catch(e){}};
/* ---------- StorageService (IndexedDB) ---------- */
const DB={db:null,
open(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('IndexedDB недоступен'));const r=indexedDB.open('frame',1);r.onupgradeneeded=()=>{['projects','palettes'].forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}))};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
all(s){return new Promise((res,rej)=>{const r=this.db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
w(s,fn){return new Promise((res,rej)=>{if(!this.db)return rej(new Error('Хранилище недоступно'));const t=this.db.transaction(s,'readwrite');fn(t.objectStore(s));t.oncomplete=()=>res();t.onerror=t.onabort=()=>rej(t.error)})},
put(s,v){return this.w(s,o=>o.put(v))},del(s,id){return this.w(s,o=>o.delete(id))}};
const pending=new Set(),tm={};let failed=false;
function status(s){const e=$('#st');e.dataset.s=s;e.textContent=s==='saving'?'Сохранение…':s==='err'?'Ошибка сохранения':'Сохранено'}
function job(key,fn,delay=400){status('saving');pending.add(key);clearTimeout(tm[key]);tm[key]=setTimeout(async()=>{try{await fn();failed=false}catch(e){failed=true;console.error(e)}pending.delete(key);if(!pending.size)status(failed?'err':'ok')},delay)}
const persist=(store,o)=>job(store+o.id,()=>DB.put(store,JSON.parse(JSON.stringify(o))));
const touch=p=>{p.updated=Date.now();persist('projects',p)};
/* ---------- Расчёты ---------- */
function calc(g){const sv=g.saved+(window.Fin?Fin.total(g):0),save=g.income-g.expenses,rem=Math.max(0,g.cost-sv),pct=g.cost>0?Math.min(100,sv/g.cost*100):0;
let months=null;if(g.cost>0&&rem===0)months=0;else if(save>0)months=Math.ceil(rem/save);
const hpm=g.days*g.hours*52/12;return{save,rem,pct,months,hr:hpm>0?g.income/hpm:0,hrs:months!=null?Math.round(months*hpm):null,over:sv-g.cost}}
const newGoal=()=>({id:uid(),name:'Новая цель',cost:100000,saved:10000,income:60000,expenses:35000,days:5,hours:6});
const LIM={days:[1,7],hours:[1,24]},lim=k=>LIM[k]||[0,1e9];
/* ---------- Цвет ---------- */
const h2r=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const r2h=a=>'#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const hsv2rgb=(h,s,v)=>{const f=n=>{const k=(n+h/60)%6;return(v-v*s*Math.max(0,Math.min(k,4-k,1)))*255};return[f(5),f(3),f(1)]};
function rgb2hsv([r,g,b]){r/=255;g/=255;b/=255;const m=Math.max(r,g,b),n=Math.min(r,g,b),d=m-n;let h=0;if(d){h=m===r?((g-b)/d)%6:m===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,m?d/m:0,m]}
const lum=hx=>{const[r,g,b]=h2r(hx).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function ColorPicker(root,hex,onChange){
let[h,s,v]=rgb2hsv(h2r(hex));
root.innerHTML=`<div class="cp"><div class="cpf"><i class="knob"></i></div>
<label class="mono">Hue<input type="range" class="hue" min="0" max="360"></label>
<label class="mono">Saturation<input type="range" class="sat" min="0" max="100"></label>
<label class="mono">Lightness<input type="range" class="lig" min="0" max="100"></label>
${['hex','rgb','hsl'].map(f=>`<div class="cin"><span class="mono">${f}</span><input class="txt" data-f="${f}" aria-label="${f}"><button data-c="${f}">Копировать</button></div>`).join('')}</div>`;
const hsl=()=>{const l=v*(1-s/2);return[h,l===0||l===1?0:(v-l)/Math.min(l,1-l),l]};
const hexNow=()=>r2h(hsv2rgb(h,s,v));
const fromHsl=(H,SL,L)=>{const V=L+SL*Math.min(L,1-L);h=H;v=V;s=V?2*(1-L/V):0};
function sync(skip){const hx=hexNow(),[,sl,l]=hsl();
$('.cpf',root).style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(${h},100%,50%))`;
const k=$('.knob',root);k.style.left=s*100+'%';k.style.top=(1-v)*100+'%';k.style.background=hx;
$('.hue',root).value=h;$('.sat',root).value=Math.round(sl*100);$('.lig',root).value=Math.round(l*100);
const[r,g,b]=h2r(hx),val={hex:hx.toUpperCase(),rgb:`${r}, ${g}, ${b}`,hsl:`${Math.round(h)}, ${Math.round(sl*100)}%, ${Math.round(l*100)}%`};
root.querySelectorAll('[data-f]').forEach(i=>{if(i!==skip){i.value=val[i.dataset.f];i.classList.remove('bad')}})}
const emit=skip=>{sync(skip);onChange(hexNow())};
const fld=$('.cpf',root);
const mv=e=>{const b=fld.getBoundingClientRect();s=cl((e.clientX-b.left)/b.width,0,1);v=1-cl((e.clientY-b.top)/b.height,0,1);emit()};
fld.onpointerdown=e=>{fld.setPointerCapture(e.pointerId);mv(e);fld.onpointermove=mv};fld.onpointerup=()=>{fld.onpointermove=null};
$('.hue',root).oninput=e=>{h=+e.target.value;emit()};
$('.sat',root).oninput=e=>{fromHsl(h,e.target.value/100,hsl()[2]);emit()};
$('.lig',root).oninput=e=>{fromHsl(h,hsl()[1],e.target.value/100);emit()};
root.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;const t=e.target.value.trim();let rgb=null;
if(f==='hex'){const m=/^#?([0-9a-f]{6}|[0-9a-f]{3})$/i.exec(t);if(m){let x=m[1];if(x.length===3)x=[...x].map(c=>c+c).join('');rgb=h2r(x)}}
else{const n=t.match(/\d+(\.\d+)?/g);if(n&&n.length===3){const a=n.map(Number);
if(f==='rgb'&&a.every(x=>x<=255))rgb=a;
if(f==='hsl'&&a[0]<=360&&a[1]<=100&&a[2]<=100){fromHsl(a[0],a[1]/100,a[2]/100);e.target.classList.remove('bad');return emit(e.target)}}}
if(!rgb)return e.target.classList.add('bad');
const keep=h;[h,s,v]=rgb2hsv(rgb);if(s===0||v===0)h=keep;e.target.classList.remove('bad');emit(e.target)});
sync()}
/* ---------- UI helpers ---------- */
function ask(msg){return new Promise(r=>{const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="dlg" role="dialog"><p>${esc(msg)}</p><div class="acts"><button data-v="0">Отмена</button><button class="pri" data-v="1">Удалить</button></div></div>`;d.onclick=e=>{const v=e.target.dataset.v;if(v!=null){d.remove();r(v==='1')}};document.body.append(d)})}
async function copy(t,btn){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}const o=btn.textContent;btn.textContent='Скопировано';setTimeout(()=>btn.textContent=o,1000)}
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const dt=t=>new Date(t).toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'});
function applyTheme(){const c=curT().colors;for(const k in CSSV)document.documentElement.style.setProperty('--'+CSSV[k],c[k])}
function go(v,x){Object.assign(S.ui,x||{},{view:v});saveUi();render()}
function render(){applyTheme();if(S.ui.view==='editor'&&!cur())S.ui.view='home';renderNav();({home,editor,themes,data})[S.ui.view]()}
function renderNav(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===S.ui.view||(b.dataset.go==='home'&&S.ui.view==='editor')));
$('#ps').innerHTML='<option value="">Проекты…</option>'+S.projects.map(p=>`<option value="${p.id}" ${p.id===S.ui.pid&&S.ui.view==='editor'?'selected':''}>${esc(p.name)}</option>`).join('')}
/* ---------- Главная ---------- */
function home(){const ps=[...S.projects].sort((a,b)=>b.updated-a.updated);
$('#app').innerHTML=`<div class="head"><h1>Проекты</h1><span class="mono">${ps.length} шт.</span></div><div class="grid">${ps.map(p=>{const g=p.goals[0],r=calc(g);return`<button class="card" data-open="${p.id}"><span class="mono">${dt(p.updated)}</span><h3>${esc(p.name)}</h3><span>${esc(g.name)} · ${fmt(g.cost)}</span>${bar(r.pct)}<span class="mono">${r.pct.toFixed(0)}% · целей: ${p.goals.length}</span></button>`}).join('')}<button class="card new" data-act="newp">+ Новый проект</button></div>`}
/* ---------- Калькулятор ---------- */
function editor(){const p=cur(),g=p.goals[Math.min(S.ui.gi,p.goals.length-1)];S.ui.gi=p.goals.indexOf(g);

function validate(o){if(!o||typeof o!=='object'||Array.isArray(o))return'Ожидался JSON-объект';if(o.app!=='frame')return'Это не экспорт FRAME';if(!Number.isInteger(o.version))return'Не указана версия данных';if(o.version>SCHEMA)return`Версия данных ${o.version} новее поддерживаемой (${SCHEMA})`;if(!Array.isArray(o.projects)||!Array.isArray(o.palettes))return'Нет списков projects и palettes';

function calc(){const s=D.set,share=s.norm+s.budget>0?s.norm/(s.norm+s.budget):.5,M={};
const g=m=>M[m]||(M[m]={earn:0,recv:0,extra:0,saveP:0,saveE:0,alloc:0,spent:0,adj:0,cat:{}});

{hook:(e,fm)=>{if(e.target.name==='ids')fm.elements.amt.value=sum([...fm.querySelectorAll('[name=ids]:checked')].map(i=>i.value))||''}})}
function extraForm(o){const rec=(date,amt)=>{const m=calc().g(mo(date)),sv=m.saveP+m.saveE-(o&&mo(o.date)===mo(date)?o.save:0),left=Math.max(0,D.set.norm-sv);return{left,rec:Math.min(amt,left)}};
const hint=fm=>{const amt=parseFloat(fm.elements.amt.value)||0,r=rec(fm.elements.date.value||today(),amt);fm.dataset.rec=r.rec;$('#hint',fm).innerHTML=`До месячной нормы: <b>${R(r.left)}</b><br>Рекомендуется отложить: <b>${R(r.rec)}</b><br>Останется свободными: <b>${R(amt-r.rec)}</b>`;return r};
form(o?'Дополнительный доход':'Дополнительный доход',[{k:'date',l:'Дата получения',t:'date'},{k:'amt',l:'Сумма, ₽',t:'number'},{k:'note',l:'Источник (необязательно)',t:'text'},{k:'save',l:'Отложить в копилку, ₽',t:'number'}],
o?{...o}:{date:today(),amt:'',note:'',save:0},
v=>{if(!v.date)return'Укажите дату';if(!(v.amt>0))return'Сумма должна быть больше нуля';if(isNaN(v.save)||v.save<0||v.save>v.amt)return'В копилку можно отложить от 0 до '+R(v.amt);
if(o)Object.assign(o,{date:v.date,amt:v.amt,note:v.note,save:v.save});else D.extras.push({id:uid(),date:v.date,amt:v.amt,note:v.note,save:v.save})},
{xtra:'<div id="hint" class="msg"></div><div class="acts" style="margin:0"><button type="button" data-q="rec">Рекомендуемая</button><button type="button" data-q="all">Вся сумма</button><button type="button" data-q="none">Ничего</button></div>',
init:fm=>{hint(fm);if(o)fm.elements.save.dataset.t=1},
hook:(e,fm)=>{if(e.target.name==='save')e.target.dataset.t=1;const r=hint(fm);if((e.target.name==='amt'||e.target.name==='date')&&!fm.elements.save.dataset.t)fm.elements.save.value=r.rec}})}
function expForm(o){form(o?'Расход':'Новый расход',[{k:'date',l:'Дата',t:'date'},{k:'amt',l:'Сумма, ₽',t:'number'},{k:'cat',l:'Категория',t:'select',opts:D.cats.map(c=>[c,c])},{k:'note',l:'Комментарий',t:'text'}],o?{...o}:{date:today(),amt:'',cat:D.cats[0],note:''},
v=>{if(!v.date)return'Укажите дату';if(!(v.amt>0))return'Сумма должна быть больше нуля';if(o)Object.assign(o,v);else D.expenses.push({id:uid(),...v})})}
function adjForm(o){form(o?'Корректировка':'Корректировка копилки',[{k:'date',l:'Дата',t:'date'},{k:'amt',l:'Сумма (можно со знаком «−»), ₽',t:'number'},{k:'note',l:'Причина (обязательно)',t:'text'}],o?{...o}:{date:today(),amt:'',note:''},
v=>{if(!v.date)return'Укажите дату';if(!v.amt)return'Введите ненулевую сумму';if(!v.note)return'Укажите причину — запись попадёт в журнал';if(o)Object.assign(o,v);else D.adj.push({id:uid(),...v})})}
function catForm(old){form(old?'Переименовать категорию':'Новая категория',[{k:'name',l:'Название',t:'text'}],{name:old||''},v=>{if(!v.name)return'Введите название';if(D.cats.includes(v.name)&&v.name!==old)return'Такая категория уже есть';
if(old){D.cats=D.cats.map(c=>c===old?v.name:c);D.expenses.forEach(x=>{if(x.cat===old)x.cat=v.name})}else D.cats.push(v.name)})}
/* ---- экраны ---- */
const TABS=[['ov','Обзор'],['sh','Смены'],['jr','Журнал'],['xp','Расходы'],['stat','Статистика'],['set','Настройки']];
function ov(){const c=calc(),m=c.g(UI.m),s=D.set,sv=m.saveP+m.saveE,left=Math.max(0,s.norm-sv),np=s.norm?sv/s.norm*100:0,gp=G.cost?(c.total+(G.saved||0))/G.cost*100:0,avail=m.alloc-m.spent;
const w=D.shifts.filter(x=>x.status==='wait'),pend=w.reduce((a,x)=>a+x.amt,0),nx=w.map(x=>x.payDate).sort()[0];
return mnav()+`<div class="grid4">${k('Заработано',R(m.earn),'начислено за смены месяца')}${k('Ожидаемые выплаты',R(pend),nx?'ближайшая: '+fd(nx):'нет ожидаемых')}${k('Фактически получено',R(m.recv),'выплаты за месяц')}${k('Дополнительные доходы',R(m.extra),'за месяц')}
${k('Доступно для расходов',R(avail),`потрачено ${R(m.spent)} из ${R(s.budget)} · ${s.budget?Math.round(m.spent/s.budget*100):0}%`,avail<0)}${k('Накоплено',R(c.total+(G.saved||0)),esc(G.name)+((G.saved||0)?' · стартовых '+R(G.saved):''))}
${k('Месячная норма',Math.round(np)+'%',bar(np)+(sv>=s.norm?'Месячная норма выполнена':'Осталось '+R(left))+' · отложено '+R(sv))}${k('Цель',Math.min(100,gp).toFixed(1)+'%',bar(gp)+'Осталось '+R(Math.max(0,G.cost-c.total-(G.saved||0))))}</div>
<div class="acts"><button class="pri" data-new="sh">+ Смена</button><button data-new="po">Зафиксировать выплату</button><button data-new="xp">+ Расход</button><button data-new="ex">+ Доп. доход</button><button data-tab="jr">История</button></div>`}
function sh(){const L={wait:'Ожидается',paid:'Выплачено',cancel:'Отменено'},t=today();
return hd('Смены',`<button class="pri" data-new="sh">+ Смена</button>`)+(D.shifts.length?[...D.shifts].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>li(fd(x.date)+`<span class="tag">${L[x.status]}</span>`,R(x.amt),`выплата ожидается ${fd(x.payDate)}${x.status==='wait'&&x.payDate<t?' · срок прошёл':''}${x.note?' · '+esc(x.note):''}`,btn('sh',x.id))).join(''):'<p class="mono">Смен пока нет</p>')}
function jr(){const sh=ids=>D.shifts.filter(x=>ids.includes(x.id)).map(x=>fd(x.date)).join(', ');
const ops=[...D.payouts.map(p=>({t:'po',id:p.id,date:p.date,l:'Выплата',a:'+'+R(p.amt),sub:`в копилку ${R(p.sv)} · на расходы ${R(p.exp)}${p.shiftIds.length?' · смены: '+sh(p.shiftIds):''}${p.note?' · '+esc(p.note):''}`})),
...D.extras.map(x=>({t:'ex',id:x.id,date:x.date,l:'Дополнительный доход',a:'+'+R(x.amt),sub:`в копилку ${R(x.save)} · свободно ${R(x.amt-x.save)}${x.note?' · '+esc(x.note):''}`})),
...D.adj.map(x=>({t:'aj',id:x.id,date:x.date,l:'Корректировка копилки',a:(x.amt>0?'+':'−')+R(Math.abs(x.amt)),sub:esc(x.note)})),
...D.expenses.map(x=>({t:'xp',id:x.id,date:x.date,l:'Расход · '+esc(x.cat),a:'−'+R(x.amt),sub:esc(x.note)}))].sort((a,b)=>b.date.localeCompare(a.date));
return hd('Журнал',`<button class="pri" data-new="po">+ Выплата</button><button data-new="ex">+ Доп. доход</button><button data-new="aj">Корректировка</button>`)+(ops.length?ops.map(o=>li(fd(o.date)+' · '+o.l,o.a,o.sub,btn(o.t,o.id))).join(''):'<p class="mono">Операций пока нет</p>')}
function xp(){const c=calc(),m=c.g(UI.m),s=D.set,av=m.alloc-m.spent,l=D.expenses.filter(x=>mo(x.date)===UI.m).sort((a,b)=>b.date.localeCompare(a.date));
return hd('Расходы',`<button class="pri" data-new="xp">+ Расход</button>`)+mnav()+`<div class="grid4">${k('Бюджет месяца',R(s.budget))}${k('Поступило в бюджет',R(m.alloc),'из выплат месяца')}${k('Потрачено',R(m.spent),(s.budget?Math.round(m.spent/s.budget*100):0)+'% бюджета')}${k('Доступно',R(av),'',av<0)}</div>`+
(l.length?l.map(x=>li(fd(x.date)+' · '+esc(x.cat),'−'+R(x.amt),esc(x.note),btn('xp',x.id))).join(''):'<p class="mono">Расходов за месяц нет</p>')+
`<h3 class="sp">Категории</h3><div class="acts">${D.cats.map(c=>`<span class="rt" style="border:1px solid var(--border);padding:2px 4px 2px 8px">${esc(c)}<button class="sm" data-cr="${esc(c)}">Изм.</button><button class="sm" data-cd="${esc(c)}">×</button></span>`).join('')}<button data-cn="1">+ Категория</button></div>`}
function stat(){const c=calc(),ms=Object.keys(c.M).sort(),s=D.set;let cum=G.saved||0;
const rows=ms.map(m=>{const x=c.M[m],sv=x.saveP+x.saveE;cum+=sv+x.adj;return{m,x,sv,cum}});
const cats=Object.entries(c.g(UI.m).cat).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...cats.map(a=>a[1]));
return hd('Статистика')+(ms.length?`<div class="tw"><table><tr><th>Месяц</th><th>Заработано</th><th>Получено</th><th>Доп.</th><th>Отложено</th><th>Расходы</th><th>Норма</th></tr>${rows.map(r=>`<tr><td>${mn(r.m)}</td><td>${R(r.x.earn)}</td><td>${R(r.x.recv)}</td><td>${R(r.x.extra)}</td><td>${R(r.sv)}</td><td>${R(r.x.spent)}</td><td>${s.norm?Math.round(r.sv/s.norm*100):0}%</td></tr>`).join('')}</table></div>
<h3 class="sp">Динамика цели</h3>${rows.map(r=>li(mn(r.m),R(r.cum),bar(G.cost?r.cum/G.cost*100:0)+' '+(G.cost?(r.cum/G.cost*100).toFixed(1):0)+'% от цели')).join('')}
<h3 class="sp">Расходы по категориям</h3>${mnav()}${cats.length?cats.map(a=>li(esc(a[0]),R(a[1]),bar(a[1]/mx*100))).join(''):'<p class="mono">Расходов за месяц нет</p>'}`:'<p class="mono">Данных пока нет — добавьте смену или доход</p>')}
function set(){const s=D.set,c=calc(),f=(k,l,t)=>`<label><span class="mono">${l}</span><input class="txt" data-s="${k}" type="${t||'number'}" step="any" inputmode="decimal" value="${esc(s[k])}"></label>`;
return hd('Настройки')+`<div class="set">${f('norm','Месячная норма накоплений, ₽')}${f('budget','Бюджет расходов в месяц, ₽')}${f('delay','Задержка выплаты, дней')}</div>
<p class="mono">Доли распределения: накопления ${(c.share*100).toFixed(1)}% / расходы ${((1-c.share)*100).toFixed(1)}% — считаются из нормы и бюджета</p>
<p class="mono sp">Цель и её стоимость берутся из калькулятора. Резервная копия — вкладка «Данные» (включает финансы).</p>`}
function render(){if(!H)return;H.box.innerHTML='<div class="ftabs">'+TABS.map(t=>`<button data-tab="${t[0]}" class="${UI.tab===t[0]?'on':''}">${t[1]}</button>`).join('')+'</div>'+({ov,sh,jr,xp,stat,set})[UI.tab]()}
/* ---- события ---- */
const FORMS={sh:shiftForm,po:payoutForm,ex:extraForm,xp:expForm,aj:adjForm};
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||!b.closest('#fin,#fmd')||!H)return;const d=b.dataset;
if(d.x)return $('#fmd').innerHTML='';
if(d.tab){UI.tab=d.tab;return render()}
if(d.mm){UI.m=shiftM(UI.m,+d.mm);return render()}
if(d.new)return FORMS[d.new]();
if(d.ed){const[t,id]=d.ed.split(':');return FORMS[t](D[MAP[t]].find(x=>x.id===id))}
if(d.del){const[t,id]=d.del.split(':');if(!await ask('Удалить операцию? Все показатели пересчитаются.'))return;
if(t==='po')D.shifts.forEach(x=>{if(x.po===id){x.po=null;x.status='wait'}});
if(t==='sh')D.payouts.forEach(p=>{p.shiftIds=p.shiftIds.filter(i=>i!==id)});
D[MAP[t]]=D[MAP[t]].filter(x=>x.id!==id);save();return render()}
if(d.q){const fm=$('#fmd form'),a=parseFloat(fm.elements.amt.value)||0;fm.elements.save.value=d.q==='rec'?fm.dataset.rec:d.q==='all'?a:0;fm.elements.save.dataset.t=1;return}
if(d.cn)return catForm();if(d.cr)return catForm(d.cr);
if(d.cd){if(D.cats.length<2)return;if(!await ask(`Удалить категорию «${d.cd}»? Её расходы перейдут в «${D.cats.find(c=>c!==d.cd)}».`))return;const to=D.cats.find(c=>c!==d.cd);D.expenses.forEach(x=>{if(x.cat===d.cd)x.cat=to});D.cats=D.cats.filter(c=>c!==d.cd);save();return render()}
if(d.copy){try{await navigator.clipboard.writeText($('#ex').value)}catch(_){$('#ex').select();document.execCommand('copy')}b.textContent='Скопировано';return setTimeout(()=>b.textContent='Копировать JSON',1200)}
if(d.reset){if(await ask('Стереть ВСЕ данные без возможности восстановления?')){D=DEF();save();render()}}});
document.addEventListener('input',e=>{const k=e.target.dataset.s;if(!k||!H)return;const t=e.target;
if(k==='goalName')D.set[k]=t.value;else{const v=parseFloat(t.value);if(!isFinite(v)||v<0||(k!=='delay'&&k!=='budget'&&v===0&&k!=='delay')||(k==='norm'&&v+D.set.budget<=0))return t.style.borderColor='var(--warn)';t.style.borderColor='';D.set[k]=k==='delay'?Math.round(v):v}
save()});

function ensure(g){const d=DEF();if(!g.fin||typeof g.fin!=='object'||Array.isArray(g.fin))g.fin=d;const f=g.fin;f.set={...d.set,...(f.set&&typeof f.set==='object'&&!Array.isArray(f.set)?f.set:{})};['shifts','payouts','expenses','extras','adj'].forEach(k=>{if(!Array.isArray(f[k]))f[k]=[]});if(!Array.isArray(f.cats)||!f.cats.length)f.cats=d.cats;f.payouts.forEach(p=>{if(!Array.isArray(p.shiftIds))p.shiftIds=[]})}
window.Fin={mount(box,p,g,touch){ensure(g);H={box,touch};G=g;D=g.fin;if(!$('#fmd')){const d=document.createElement('div');d.id='fmd';document.body.append(d)}render()},
total(g){if(!g.fin)return 0;const d0=D,g0=G;ensure(g);D=g.fin;G=g;const t=calc().total;D=d0;G=g0;return t}};
})();
/* ---------- Запуск ---------- */
(async()=>{try{Object.assign(S.ui,JSON.parse(localStorage.getItem('frame.ui')))}catch(e){}
let ok=true;try{await DB.open();S.projects=await DB.all('projects');S.palettes=await DB.all('palettes')}catch(e){ok=false;console.error(e)}
if(!allT().some(t=>t.id===S.ui.theme))S.ui.theme='paper';
render();ok?status('ok'):status('err')})();
</script></body></html>
